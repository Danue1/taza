[workspace]
resolver = "3"
members = [
    "crates/taza-engine",
    "crates/taza-toolchain",
    "crates/taza-evaluation",
    "crates/taza-ffi",
]

[workspace.package]
edition = "2024"
license = "MIT"

# 판을 한 곳에서만 정한다 — 크레이트마다 따로 적으면 같은 라이브러리가 두 판으로
# 갈리고, 기기에 나가는 것이 무엇인지 세는 일(`taza-licenses`)도 흐려진다.
[workspace.dependencies]
taza-engine = { path = "crates/taza-engine", default-features = false }
taza-toolchain = { path = "crates/taza-toolchain" }

bzip2 = "0.6.1"
flate2 = "1.1.9"
memmap2 = "0.9"
ruzstd = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2"
toml = "1.1.3"
uniffi = "0.29"
ureq = "3.3.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"
