[workspace]
resolver = "3"
members = [
    "crates/taza-engine",
    "crates/taza-pack",
    "crates/taza-corpus",
    "crates/taza-packbuild",
    "crates/taza-evaluation",
    "crates/taza-ffi",
    "crates/taza-licenses",
    "crates/taza-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"

# 판을 한 곳에서만 정한다 — 크레이트마다 따로 적으면 같은 라이브러리가 두 판으로
# 갈리고, 기기에 나가는 것이 무엇인지 세는 일(`taza-licenses`)도 흐려진다.
[workspace.dependencies]
taza-engine = { path = "crates/taza-engine", default-features = false }
taza-corpus = { path = "crates/taza-corpus" }
taza-pack = { path = "crates/taza-pack" }
taza-packbuild = { path = "crates/taza-packbuild" }

bzip2 = "0.6.1"
flate2 = "1.1.9"
memmap2 = "0.9"
ruzstd = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2"
toml = "1.1.3"
# 기본 기능인 `cargo-metadata`는 바인딩 생성기에서만 쓰인다 — 기기에 나가는 정적
# 라이브러리가 크레이트 그래프 조회 라이브러리를 지고 갈 이유가 없다.
uniffi = { version = "0.29", default-features = false }
# 원천을 내려받는 데만 쓰는 HTTP다. 기본 백엔드(rustls+ring)는 이 워크스페이스에서
# 제일 긴 컴파일 사슬을 만든다 — 운영체제가 이미 갖고 있는 TLS를 빌려 쓴다.
ureq = { version = "3.3.0", default-features = false, features = ["gzip", "native-tls"] }
# zip은 읽기만 한다. 기본 `deflate`는 인코더(zopfli)와 별도 zlib 구현을 함께 켜서,
# ureq와 나눠 쓰던 압축 백엔드를 하나 더 컴파일하게 만든다.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# 쓰는 것은 `Decoder`·`Encoder`·`encode_all`뿐이다. 기본으로 켜지는 `legacy`(2016년대
# zstd 포맷 디코더)와 `zdict_builder`는 한 줄도 쓰지 않으면서 C 컴파일을 절반 늘린다.
zstd = { version = "0.13.3", default-features = false }
