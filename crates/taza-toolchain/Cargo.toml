[package]
name = "taza-toolchain"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
taza-engine = { workspace = true, features = ["lang-hangul"] }
toml = "1.1.3"
ureq = "3.3.0"
zstd = "0.13.3"
