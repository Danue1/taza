# 영어 언어팩 — 앱에 내장되는 기본 언어라 크기 예산을 먼저 본다.
#
# 어휘 인벤토리는 SCOWL(관대한 커스텀 라이선스), 실사용 빈도는 Tatoeba(CC-BY 2.0 FR).
# 둘 다 저작자 표시만 요구하므로 share-alike가 파생 팩에 옮겨붙지 않는다.
# 대문자 목록(upper·proper-names)은 넣지 않는다 — 조회가 대소문자를 구분하므로 v1
# 라틴 경로에서는 소문자 표제어만 쓸모가 있다.

name = "english"
language = "en"
# 표시 이름·키캡 표기·조합 골격은 팩이 밝힌다 — 코어와 셸은 자기 표를 두지 않는다.
display_name = "English"
keycap_label = "A"
layout_name = "QWERTY"
composer_skeleton = "latin"
pack_version = 2

[lexicon]
encoding = "utf8"
character_set = "latin-lowercase"
max_words = 80000
minimum_word_length = 2

# 내장 팩이라 문맥 신호도 크기 예산 안에서 고른다 — 이득 상위만 담는다.
[language_model]
max_bigrams = 25000
minimum_count = 5

[script]
word_separated = true
right_to_left = false

[[sources]]
name = "SCOWL"
version = "2020.12.07"
license = "SCOWL permissive (Kevin Atkinson)"
attribution = "Word lists from SCOWL 2020.12.07, Copyright 2000-2018 Kevin Atkinson. Used and redistributed under the SCOWL license."
url = "https://downloads.sourceforge.net/project/wordlist/SCOWL/2020.12.07/scowl-2020.12.07.tar.gz"
sha256 = "5587667caa20c4891390c2d42dbb4d5c4c3f41bee77af1457ece3ba23fb859cc"
role = "inventory"
weight = 1.0
format = "scowl"
dialects = ["english", "american"]
categories = ["words", "contractions"]
# 70까지가 일상 어휘의 경계 — 80 이상은 희귀어·전문어가 급증해 오교정 위험만 늘린다.
maximum_size = 70

[[sources]]
name = "Tatoeba sentences (eng)"
version = "2026-07-25"
license = "CC-BY 2.0 FR"
attribution = "Word frequencies derived from the Tatoeba Project English sentence export (https://tatoeba.org), licensed CC-BY 2.0 FR."
url = "https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2"
sha256 = "82247a6399d2bf0c384e834e799a6ed48ad5292ea723b86075d01dfad457d287"
role = "frequency"
# 인벤토리 등급(0~1)보다 크게 잡아 실사용 빈도가 랭킹을 주도하게 한다 — 등급은
# 코퍼스에 안 나온 낱말의 순서를 정하는 바닥 역할이다.
weight = 0.35
format = "tatoeba"
minimum_count = 2

# CLDR 이모지 주석 — 이모지마다 그것을 부르는 낱말이 달려 있다("😀": smile, happy, face).
# 낱말을 치면 그 낱말에 달린 이모지가 후보 바에 곁들여진다. 표제어를 늘리지는 않는다 —
# 사전에 이미 있는 낱말에만 이모지를 단다.
[[sources]]
name = "CLDR emoji annotations (en)"
version = "48.2"
license = "Unicode-3.0"
attribution = "Emoji annotations from Unicode CLDR 48.2 (https://cldr.unicode.org), Copyright © 1991-2025 Unicode, Inc., licensed under the Unicode License v3."
url = "https://raw.githubusercontent.com/unicode-org/cldr/release-48-2/common/annotations/en.xml"
sha256 = "8511aadd046fdba2f0ffe590266ced8bbf48175ad139b2675d85d7141057b235"
role = "inventory"
weight = 1.0
format = "cldr-annotations"

# 유니코드 이모지 정본 표 — 이모지가 어느 묶음(스마일리·동물·음식…)에 속하고 어떤 차례로
# 서는지를 밝힌다. 표제어도 낱말도 늘리지 않는다: 검색면이 검색어 없이 보여 줄 차례만 준다.
# 빌트인 키보드가 쓰는 묶음과 같은 자료이므로, 사람이 찾던 자리에서 찾게 된다.
[[sources]]
name = "Unicode emoji test data"
version = "16.0"
license = "Unicode-3.0"
attribution = "Emoji ordering from Unicode emoji-test.txt 16.0 (https://unicode.org), Copyright © 1991-2024 Unicode, Inc., licensed under the Unicode License v3."
url = "https://unicode.org/Public/emoji/16.0/emoji-test.txt"
sha256 = "24f0c534e86cf142e2496953e8f0e46a3e702392911eddcd29c6cced85139697"
role = "inventory"
weight = 1.0
format = "emoji-test"
