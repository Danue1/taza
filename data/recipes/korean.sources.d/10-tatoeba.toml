# 구어체 문장 코퍼스. 규모는 작지만(6,500 낱말) 유일하게 입말을 담은 자동 조달 원천이다 —
# 위키백과는 문어체라 "했어", "좋아해", "먹었어" 같은 종결형이 아예 나타나지 않는다.
#
# 표제어 기여 수만 보면 대수롭지 않아 보이지만(단독 405개) 그 얼마 안 되는 낱말이 정확히
# 사람이 키보드로 가장 많이 치는 형태다. 크기로 값어치를 재면 놓친다 — 이 원천을 뺐다가
# 되돌린 적이 있고, 되돌리자 타이핑 절약률이 0.485에서 0.525로 올랐다.
#
# weight를 1.0까지 올려 보았으나 0.5가 더 낫다. 구어체를 끌어올리는 몫은 그대로 하면서
# 작은 코퍼스의 표본 편향이 상위 순위를 흔들지 않는 자리다.

