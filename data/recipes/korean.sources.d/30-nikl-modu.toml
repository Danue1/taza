# 국립국어원 모두의 말뭉치 — 이용 신청과 승인을 거쳐 손으로 내려받는 원천이라
# URL로 조달할 수 없다. 파일이 자리에 없으면 건너뛰므로, 아직 받지 않았어도 팩은 나온다.
# 받는 법은 data/sources/local/README.md에 적어 두었다.
#
# 신문·구어·메신저를 함께 두는 이유는 어휘가 서로 다른 곳에서 오기 때문이다. 신문은
# 새 외래어와 시사어를, 구어와 메신저는 사전에 결코 오르지 않는 입말과 신어를 낸다.
# 승격 문턱의 `minimum_sources`가 이 셋을 서로의 검증으로 쓴다 — 한 말뭉치에서만 보인
# 낱말은 그 말뭉치의 버릇일 뿐이다.

