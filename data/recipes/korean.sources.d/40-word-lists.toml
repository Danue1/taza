# 낱말 목록으로 들어오는 어휘. 사전·용어집·신어 자료는 배포 형식이 저마다 다르고
# 상당수가 손으로 받아야 하므로, 원천마다 파서를 늘리는 대신 `낱말` 또는
# `낱말<TAB>빈도` 한 꼴로 뽑아 두게 한다. 새 어휘를 들이는 일이 파일 하나를 떨구고
# 이 파일에 대여섯 줄을 더하는 일이 된다.
#
# 목록은 인벤토리 역할이다 — 사전이 이미 낱말임을 보증했으므로 코퍼스 증거를 기다릴
# 이유가 없다. 순위는 코퍼스가 잡으므로 `rank`는 사전 표제어 사이의 기본 자리만 정한다.

