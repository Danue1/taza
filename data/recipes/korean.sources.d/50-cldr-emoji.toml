# CLDR 이모지 주석 — 이모지마다 그것을 부르는 낱말이 달려 있다("😀": 미소·스마일·웃음).
# 낱말을 치면 그 낱말에 달린 이모지가 후보 바에 곁들여진다.
#
# 어절 하나로 치는 낱말만 받는다. "활짝 웃는 얼굴" 같은 대표 이름은 후보 바가 상대하는
# 단위가 아니다 — 사람은 어절을 치고, 그 어절에 이모지가 달려 있어야 한다.
#
# 이 원천은 표제어를 늘리지 않는다. 사전에 이미 있는 낱말에만 이모지를 달며, 그래서
# role이 없어도 될 법하지만 원천 표의 모양을 맞추려 inventory로 둔다(보증하는 낱말은 없다).

