# 얼굴 문자 — 글자로 그린 얼굴((^_^), orz). 낱말을 치면 후보 바에 곁들여지고, 통합 검색면의
# "얼굴 문자" 그룹에도 같은 목록이 선다.
#
# 이모지·기호는 CLDR이 낱말을 알려 주지만 얼굴 문자에는 그런 원천이 없다 — 어느 얼굴을
# 어떤 낱말로 부르는지가 문화권마다 다르고 표준화된 적도 없다. 그래서 저장소 안에
# 갖춰 두고(재배포 조건이 우리에게 있다) 로컬 원천으로 읽는다.
#
# 이 원천도 표제어를 늘리지 않는다 — 사전에 이미 있는 낱말에만 얼굴 문자를 단다.

