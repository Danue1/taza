# 한국어 언어팩 — 형태소 사전을 인벤토리로 쓴다.
#
# 어절 단위 사전은 교착어 특성상 폭발하므로(체언 × 조사) 표제어는 형태소·기본형으로
# 두고, 조사·어미 결합은 형태소 언어모델 단계의 과제로 남긴다. 저장 인코딩은 자모
# 두벌식 ASCII — trie의 바이트 편집거리가 자모 편집거리가 된다.
#
# mecab-ko-dic은 Apache-2.0, Tatoeba는 CC-BY 2.0 FR. 한국어 Tatoeba 익스포트는 작아서
# 빈도 신호로는 얇다 — 순서의 골격은 사전 비용이 잡고, 코퍼스는 흔한 낱말을 끌어올린다.

name = "korean"
language = "ko"
pack_version = 1
layout = "../dubeolsik-layout.txt"

[lexicon]
encoding = "hangul-jamo-dubeolsik"
character_set = "hangul-syllables"
max_words = 120000
minimum_word_length = 1

# 한국어 Tatoeba 익스포트가 작아 문맥 신호도 얇다 — 임계를 낮추되 상한을 보수적으로.
[language_model]
max_bigrams = 15000
minimum_count = 2

[script]
word_separated = true
right_to_left = false

[[sources]]
name = "mecab-ko-dic"
version = "2.1.1-20180720"
license = "Apache-2.0"
attribution = "Korean morpheme dictionary from mecab-ko-dic 2.1.1-20180720 (https://bitbucket.org/eunjeon/mecab-ko-dic), licensed under Apache License 2.0."
url = "https://bitbucket.org/eunjeon/mecab-ko-dic/downloads/mecab-ko-dic-2.1.1-20180720.tar.gz"
sha256 = "fd62d3d6d8fa85145528065fabad4d7cb20f6b2201e71be4081a4e9701a5b330"
role = "inventory"
weight = 1.0
format = "mecab-ko-dic"
# 홀로 쓰이는 품사만 — 조사(J)·어미(E)·한자(Hanja)·인명(Person)은 표제어로 두면
# 제안 잡음이 된다. 인명·지명은 개인화 스토어가 학습으로 메운다.
files = [
    "NNG.csv",
    "NNP.csv",
    "NNB.csv",
    "NR.csv",
    "NP.csv",
    "MM.csv",
    "MAG.csv",
    "MAJ.csv",
    "IC.csv",
    "CoinedWord.csv",
    "Wikipedia.csv",
]
# 용언 어간에 종결어미 `다`를 붙여 기본형으로 만든다
verb_stem_files = ["VV.csv", "VA.csv"]
# 흔한 체언에만 조사를 붙여 어절을 만든다 — 형태소만 담으면 실제로 치는 "우리가",
# "학교에서" 같은 어절이 사전에 없어 제안이 비게 된다.
particle_expansion_nouns = 15000

[[sources]]
name = "Tatoeba sentences (kor)"
version = "2026-07-25"
license = "CC-BY 2.0 FR"
attribution = "Word frequencies derived from the Tatoeba Project Korean sentence export (https://tatoeba.org), licensed CC-BY 2.0 FR."
url = "https://downloads.tatoeba.org/exports/per_language/kor/kor_sentences.tsv.bz2"
sha256 = "1e75b53722411690b92f1780fe6d81cf152d0ca0db95e66748ae96f057306fe0"
role = "frequency"
weight = 0.5
format = "tatoeba"
minimum_count = 2
