# 한국어 언어팩 — 형태소 사전을 인벤토리로, 코퍼스를 어휘의 갱신 통로로 쓴다.
#
# 어절 단위 사전은 교착어 특성상 폭발하므로(체언 × 조사) 표제어는 형태소·기본형으로
# 두고, 조사·어미 결합은 형태소 언어모델 단계의 과제로 남긴다. 저장 인코딩은 자모
# 두벌식 ASCII — trie의 바이트 편집거리가 자모 편집거리가 된다.
#
# 사전은 외래어와 신어에서 늘 뒤늦다. 형태소 사전은 2018년판이고 사람이 오늘 치는
# 말("유튜브", "밈", "구독자")은 거기에 없다. 그래서 코퍼스에 discovery 역할을 주어,
# 증거가 문턱을 넘은 낱말은 사전에 없어도 표제어가 되게 했다 — 아래 [lexicon.admission].
#
# 원천 목록은 이 파일이 아니라 korean.sources.d/에 조각으로 둔다. 말뭉치는 계속
# 늘어나므로, 새 말뭉치를 들이는 일이 파일 하나를 떨구는 일이어야 한다.

name = "korean"
language = "ko"
# 표시 이름·키캡 표기·조합 골격은 팩이 밝힌다 — 코어와 셸은 자기 표를 두지 않는다.
display_name = "한국어"
keycap_label = "한"
layout_name = "두벌식"
composer_skeleton = "hangul"
pack_version = 1
layout = "../dubeolsik-layout.txt"
source_directory = "korean.sources.d"

[lexicon]
encoding = "hangul-jamo-dubeolsik"
character_set = "hangul-syllables"
max_words = 200000
minimum_word_length = 1
# 사전에는 기본형("있다")만 있고 사람이 실제로 치는 것은 활용형("있어", "있는")이다.
# 활용 규칙을 코드로 생성하려면 불규칙까지 다뤄야 하지만, 무엇이 실제로 쓰이는지는
# 코퍼스가 이미 알고 있다 — 어간 조건으로 고유명사·오타가 섞이는 길만 막는다.
accept_inflections = true

# 사전 밖 낱말이 표제어가 되는 문턱. 느슨하면 인명·오타가, 빡빡하면 신어가 못 들어온다.
# 무엇이 실제로 들어왔는지는 빌드가 남기는 build/korean-promoted.tsv로 확인한다.
[lexicon.admission]
minimum_count = 300
minimum_sources = 1
maximum = 20000

[language_model]
max_bigrams = 50000
minimum_count = 3

[script]
word_separated = true
right_to_left = false
