name: Taza
options:
  bundleIdPrefix: io.danuel.taza
  deploymentTarget:
    iOS: "16.0"
# 언어팩 배포처는 Packs.xcconfig가 정한다 — 여기(프로젝트 설정)에 두면 xcconfig보다
# 우선순위가 높아 로컬 덮어쓰기가 먹지 않는다.
configFiles:
  Debug: Packs.xcconfig
  Release: Packs.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  TazaApp:
    type: application
    platform: iOS
    # 디자인 시스템·언어 설정은 익스텐션과 앱이 함께 쓴다
    sources:
      - TazaApp
      - TazaDesignSystem
      - TazaShared
      # 사전 다운로드·설치는 컨테이너 앱 전담이므로 앱도 코어 FFI를 링크한다
      - Generated
    # 사전을 앱이 내려받아 익스텐션이 읽으려면 둘이 같은 App Group을 봐야 한다.
    # 시뮬레이터는 프로비저닝을 검증하지 않아 서명 팀 없이도 동작하고, 실기기에서는
    # 개발자 계정에 이 그룹을 등록해야 설치된다.
    entitlements:
      path: TazaApp/TazaApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.danuel.taza
    info:
      path: TazaApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Taza
        # 기본 언어는 한국어이고 영어를 함께 담는다 — 문자열은 Localizable.xcstrings가
        # 갖고, 시스템이 내주는 버튼 라벨(편집·삭제)도 이 선언을 따라 번역된다.
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        CFBundleURLTypes:
          - CFBundleURLName: io.danuel.taza
            CFBundleURLSchemes: [taza]
        # 언어팩 배포처. 개발 중에는 로컬 카탈로그(file:// 또는 사내 호스트)를 가리킨다.
        TazaPackCatalogURL: $(TAZA_PACK_CATALOG_URL)
    dependencies:
      - target: TazaKeyboard
        embed: true
      - framework: TazaFfi.xcframework
        embed: false
  TazaKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.danuel.taza.TazaApp.keyboard
    sources:
      - TazaKeyboard
      - TazaDesignSystem
      - TazaShared
      - Generated
      # 기본 언어만 내장한다 — 나머지 언어는 컨테이너 앱이 내려받아 App Group에 놓고,
      # 익스텐션은 설치된 팩을 우선해서 mmap한다 (PackStore).
      - path: ../../data/packs/english.tazapack
        buildPhase: resources
    entitlements:
      path: TazaKeyboard/TazaKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.danuel.taza
    info:
      path: TazaKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Taza Keyboard
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
    dependencies:
      - framework: TazaFfi.xcframework
        embed: false
